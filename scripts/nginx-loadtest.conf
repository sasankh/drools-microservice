# nginx load-balancer for Phase 9 multi-container load tests.
# Mounted by scripts/docker-compose.loadtest-multi.yml at /etc/nginx/nginx.conf.
# JMeter targets http://localhost:8080 (this server); requests round-robin across
# drools-app-{1,2,3}:8080 inside the drools-network. Passive health checks
# (max_fails=2 fail_timeout=10s) quarantine a replica after 2 connection or 5xx
# failures within a 10s window, matching the resilience profile of ECS+ALB.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream drools-backend {
        server app1:8080 max_fails=2 fail_timeout=10s;
        server app2:8080 max_fails=2 fail_timeout=10s;
        server app3:8080 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    log_format upstream_log '$remote_addr -> $upstream_addr "$request" '
                            '$status ${request_time}s ups=${upstream_response_time}s';
    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        client_max_body_size 10m;

        # Single catch-all — all requests (including /admin/health) inherit the same proxy
        # headers. Earlier versions had a `location = /admin/health` exact-match block which
        # did NOT set `proxy_set_header Host`, so nginx defaulted Host to the upstream name
        # ("drools-backend") and Tomcat rejected it with HTTP 400 (RFC 3986 disallows
        # underscores in the host component). Keeping just one location keeps Host=$host
        # consistent.
        location / {
            proxy_pass http://drools-backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Allow a 30s rule-execution timeout plus headroom for slow GC pauses.
            proxy_connect_timeout 2s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;

            # Quietly re-try on connection failure / upstream 5xx (passive health kicks in).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
