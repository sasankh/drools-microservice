server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Request size limits for security
  max-http-request-size: ${MAX_HTTP_REQUEST_SIZE:10MB}
  max-http-post-size: ${MAX_HTTP_POST_SIZE:10MB}
  tomcat:
    max-http-post-size: ${MAX_HTTP_POST_SIZE:10MB}
    max-swallow-size: ${MAX_SWALLOW_SIZE:2MB}

# Spring Boot Actuator management port (/actuator/* endpoints only)
# Note: Custom /admin/* endpoints (AdminController, MemoryController) serve on the main port (8080)
management:
  server:
    port: ${ADMIN_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

spring:
  application:
    name: drools-rule-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Additional request size limits
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  # Spring MVC Configuration
  mvc:
    # Disable NoResourceFoundException for unmapped paths (Spring Boot 3.2+)
    # This prevents log errors when ResourceHttpRequestHandler can't find static resources
    throw-exception-if-no-handler-found: false
    log-resolved-exception: false

  # Redis Configuration (Optional)
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

# Drools Configuration
drools:
  admin:
    api-key: ${ADMIN_API_KEY:}  # Set to protect /admin/* endpoints
  rule-source: ${RULE_SOURCE:local}
  s3:
    bucket-name: ${RULE_BUCKET_NAME:local-rules}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}  # For LocalStack
  local:
    rules-directory: ${LOCAL_RULES_DIRECTORY:src/main/resources/rules}
  cache:
    lru-max-size: ${LRU_CACHE_MAX_SIZE:100}
    execution-timeout-seconds: ${RULE_EXECUTION_TIMEOUT_SECONDS:30}
  refresh:
    auto-enabled: ${AUTO_REFRESH_ENABLED:false}
    interval-minutes: ${AUTO_REFRESH_INTERVAL_MINUTES:5}
  timeout:
    http:
      connection: ${DROOLS_HTTP_CONNECTION_TIMEOUT:10}
      read: ${DROOLS_HTTP_READ_TIMEOUT:30}
    rule-execution: ${DROOLS_RULE_EXECUTION_TIMEOUT:30}
    storage:
      operation: ${DROOLS_STORAGE_OPERATION_TIMEOUT:60}
    cache:
      operation: ${DROOLS_CACHE_OPERATION_TIMEOUT:5}
  circuit-breaker:
    s3:
      failure-rate-threshold: ${DROOLS_CB_S3_FAILURE_RATE:50}
      wait-duration-in-open-state: ${DROOLS_CB_S3_WAIT_DURATION:60000}
      sliding-window-size: ${DROOLS_CB_S3_SLIDING_WINDOW:100}
      minimum-number-of-calls: ${DROOLS_CB_S3_MIN_CALLS:10}
    redis:
      failure-rate-threshold: ${DROOLS_CB_REDIS_FAILURE_RATE:60}
      wait-duration-in-open-state: ${DROOLS_CB_REDIS_WAIT_DURATION:30000}
      sliding-window-size: ${DROOLS_CB_REDIS_SLIDING_WINDOW:50}
      minimum-number-of-calls: ${DROOLS_CB_REDIS_MIN_CALLS:5}
  thread-pool:
    rule-execution:
      core-size: ${DROOLS_THREAD_POOL_CORE_SIZE:10}
      max-size: ${DROOLS_THREAD_POOL_MAX_SIZE:50}
      queue-capacity: ${DROOLS_THREAD_POOL_QUEUE_CAPACITY:100}
      keep-alive: ${DROOLS_THREAD_POOL_KEEP_ALIVE:60}
    storage:
      core-size: ${DROOLS_STORAGE_THREAD_POOL_CORE_SIZE:5}
      max-size: ${DROOLS_STORAGE_THREAD_POOL_MAX_SIZE:20}
      queue-capacity: ${DROOLS_STORAGE_THREAD_POOL_QUEUE_CAPACITY:50}
      keep-alive: ${DROOLS_STORAGE_THREAD_POOL_KEEP_ALIVE:60}
  validation:
    rule-id:
      max-length: ${DROOLS_VALIDATION_RULE_ID_MAX_LENGTH:255}
    data:
      max-fields: ${DROOLS_VALIDATION_DATA_MAX_FIELDS:100}
      max-string-length: ${DROOLS_VALIDATION_DATA_MAX_STRING_LENGTH:10000}
      max-number-value: ${DROOLS_VALIDATION_DATA_MAX_NUMBER_VALUE:1000000000}
    request:
      max-size-bytes: ${DROOLS_VALIDATION_REQUEST_MAX_SIZE_BYTES:1048576}
  cors:
    allowed-origins: ${DROOLS_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${DROOLS_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${DROOLS_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${DROOLS_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${DROOLS_CORS_MAX_AGE:3600}
  rate-limiting:
    enabled: ${DROOLS_RATE_LIMITING_ENABLED:true}
    requests-per-minute: ${DROOLS_RATE_LIMITING_REQUESTS_PER_MINUTE:1000}
    requests-per-hour: ${DROOLS_RATE_LIMITING_REQUESTS_PER_HOUR:10000}
    burst-size: ${DROOLS_RATE_LIMITING_BURST_SIZE:100}
    cleanup-interval-minutes: ${DROOLS_RATE_LIMITING_CLEANUP_INTERVAL:5}
    max-clients: ${DROOLS_RATE_LIMITING_MAX_CLIENTS:10000}

# Redis Configuration
redis:
  enabled: ${REDIS_ENABLED:false}
  ttl-minutes: ${REDIS_TTL_MINUTES:60}

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}  # For LocalStack
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    connection-pool:
      max-connections: ${AWS_S3_MAX_CONNECTIONS:50}
      max-idle-time: ${AWS_S3_MAX_IDLE_TIME:60}
      connection-timeout: ${AWS_S3_CONNECTION_TIMEOUT:10}
      socket-timeout: ${AWS_S3_SOCKET_TIMEOUT:60}

# Logging Configuration
logging:
  level:
    root: INFO
    com.company.drools: ${LOG_LEVEL:INFO}
    org.drools: WARN
    org.kie: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '{"timestamp":"%d{ISO8601}","level":"%level","logger":"%logger","message":"%message","thread":"%thread"}%n'

# Metrics Configuration
management.metrics:
  export:
    cloudwatch:
      namespace: DroolsEngine
      enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
  tags:
    application: ${spring.application.name}
    environment: ${SPRING_PROFILES_ACTIVE:local}

---
# Local Development Profile
spring:
  config:
    activate:
      on-profile: local
      
drools:
  rule-source: local
  
redis:
  enabled: false
  
logging:
  level:
    com.company.drools: DEBUG

---
# Development Profile (with LocalStack)
spring:
  config:
    activate:
      on-profile: dev

drools:
  rule-source: s3
  s3:
    endpoint: http://localhost:4566
  timeout:
    http:
      connection: 5
      read: 15
    rule-execution: 15
    storage:
      operation: 30
    cache:
      operation: 3
  circuit-breaker:
    s3:
      failure-rate-threshold: 60
      wait-duration-in-open-state: 30000
      sliding-window-size: 50
      minimum-number-of-calls: 5
    redis:
      failure-rate-threshold: 70
      wait-duration-in-open-state: 15000
      sliding-window-size: 25
      minimum-number-of-calls: 3

aws:
  endpoint: http://localhost:4566
  access-key-id: test
  secret-access-key: test
  s3:
    connection-pool:
      max-connections: 25
      max-idle-time: 30
      connection-timeout: 5
      socket-timeout: 30

redis:
  enabled: true

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

drools:
  rule-source: s3
  refresh:
    auto-enabled: true
  timeout:
    http:
      connection: 10
      read: 30
    rule-execution: 30
    storage:
      operation: 60
    cache:
      operation: 5
  circuit-breaker:
    s3:
      failure-rate-threshold: 40
      wait-duration-in-open-state: 120000
      sliding-window-size: 200
      minimum-number-of-calls: 20
    redis:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60000
      sliding-window-size: 100
      minimum-number-of-calls: 10
  thread-pool:
    rule-execution:
      core-size: 20
      max-size: 100
      queue-capacity: 200
      keep-alive: 300
    storage:
      core-size: 10
      max-size: 50
      queue-capacity: 100
      keep-alive: 300

redis:
  enabled: true

aws:
  s3:
    connection-pool:
      max-connections: 100
      max-idle-time: 120
      connection-timeout: 5
      socket-timeout: 30

management.metrics.export.cloudwatch.enabled: true

logging:
  level:
    com.company.drools: INFO
    root: WARN

---
# Docker Profile (containerized environment)
spring:
  config:
    activate:
      on-profile: docker

drools:
  rule-source: s3
  timeout:
    http:
      connection: 8
      read: 25
    rule-execution: 25
    storage:
      operation: 45
    cache:
      operation: 3
  circuit-breaker:
    s3:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 45000
      sliding-window-size: 75
      minimum-number-of-calls: 8
    redis:
      failure-rate-threshold: 65
      wait-duration-in-open-state: 30000
      sliding-window-size: 40
      minimum-number-of-calls: 5
  thread-pool:
    rule-execution:
      core-size: 8
      max-size: 20
      queue-capacity: 50
      keep-alive: 120
    storage:
      core-size: 4
      max-size: 10
      queue-capacity: 25
      keep-alive: 120

redis:
  enabled: true

aws:
  s3:
    connection-pool:
      max-connections: 25
      max-idle-time: 60
      connection-timeout: 5
      socket-timeout: 30

logging:
  level:
    com.company.drools: INFO
    root: INFO