version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Main API
      # Actuator (/actuator/*) has no authentication — bind to loopback only so metrics/info are
      # not exposed on any external interface. Internal probes reach it over the compose network. (P5)
      - "127.0.0.1:8081:8081"  # Spring Boot Actuator (/actuator/*) — host-loopback only
    # Resource limits for container-aware JVM
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    volumes:
      - ./heap-dumps:/tmp/heap-dumps
      - ./gc-logs:/tmp/gc-logs
    environment:
      # JVM Memory & GC Configuration
      - JAVA_OPTS=-Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heap-dumps/heapdump.hprof -Xlog:gc*:file=/tmp/gc-logs/gc.log:time,uptime,level,tags

      # Rule source configuration
      - RULE_SOURCE=s3
      - RULE_BUCKET_NAME=local-rules

      # AWS/LocalStack configuration
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

      # Redis configuration
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379

      # Cache configuration (Redis decorator + pub/sub fan-out)
      - REDIS_DRL_RULES_TTL_MINUTES=15
      - REDIS_PUBSUB_ENABLED=true
      - RULE_EXECUTION_TIMEOUT_SECONDS=30
      
      # Thread pool configuration for containerized environment
      - DROOLS_THREAD_POOL_CORE_SIZE=8
      - DROOLS_THREAD_POOL_MAX_SIZE=20
      - DROOLS_THREAD_POOL_QUEUE_CAPACITY=50
      - DROOLS_STORAGE_THREAD_POOL_CORE_SIZE=4
      - DROOLS_STORAGE_THREAD_POOL_MAX_SIZE=10
      
      # S3 connection pool optimization
      - AWS_S3_MAX_CONNECTIONS=25
      - AWS_S3_CONNECTION_TIMEOUT=5
      - AWS_S3_SOCKET_TIMEOUT=30
      
      # Auto refresh configuration
      - AUTO_REFRESH_ENABLED=false
      - AUTO_REFRESH_INTERVAL_MINUTES=5
      
      # Logging
      - LOG_LEVEL=INFO

      # Admin API authentication — REQUIRED in the docker profile (the app fails to start without it).
      # Matches the X-Admin-API-Key header used throughout full-docker-test-plan.md. Change this for
      # any real deployment.
      - ADMIN_API_KEY=admin-secret

      # Spring profile for containerized environment
      - SPRING_PROFILES_ACTIVE=docker
      
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drools-network
    restart: unless-stopped
    healthcheck:
      # /admin/* now requires the admin key (see AdminAuthFilter). The container healthcheck must
      # send it, otherwise /admin/health returns 401 and the container is marked unhealthy. (P1)
      test: ["CMD", "wget", "--quiet", "--tries=1", "--header=X-Admin-API-Key: admin-secret", "-O", "/dev/null", "http://localhost:8080/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  localstack:
    image: localstack/localstack:2.3
    ports:
      - "127.0.0.1:4566:4566"  # LocalStack edge port
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - PERSISTENCE=1
    volumes:
      - "./init-localstack.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "./sample-rules:/tmp/sample-rules"
      - "localstack-data:/tmp/localstack"
    networks:
      - drools-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal s3 ls s3://local-rules/ --recursive 2>/dev/null | grep -q .drl"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis-data:/data
    networks:
      - drools-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  drools-network:
    driver: bridge

volumes:
  localstack-data:
    driver: local
  redis-data:
    driver: local